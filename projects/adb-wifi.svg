<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4a0"/>
      <stop offset="1" stop-color="#0b7a8f"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- wifi waves radiating from the phone -->
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round">
    <path d="M84 70 A 62 62 0 0 1 172 70" opacity="0.45"/>
    <path d="M100 90 A 38 38 0 0 1 156 90" opacity="0.75"/>
  </g>
  <!-- phone -->
  <rect x="88" y="112" width="80" height="124" rx="16" fill="#fff"/>
  <rect x="97" y="126" width="62" height="86" rx="6" fill="#0b4f5e"/>
  <circle cx="128" cy="224" r="4" fill="#0b4f5e"/>
  <!-- connected dot on screen -->
  <circle cx="128" cy="169" r="14" fill="#2dd4a0"/>
  <path d="M121 169 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
