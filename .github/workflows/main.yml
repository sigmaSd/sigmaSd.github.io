# On every push this script is executed
on: push
name: Build and deploy GH Pages
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build_and_deploy
        # Pinned to master: it bundles Zola 0.23.6, newer than the last tag (v0.23.1). tabi 5 needs >= 0.23.6.
        uses: shalzz/zola-deploy-action@67789514e71b810b2d6a1ec9c19a7f76fc51d670
        env:
          # Target branch
          PAGES_BRANCH: gh-pages
          # Use the automatic GITHUB_TOKEN for publishing
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Theme is now a regular folder
          BUILD_THEMES: false
